<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="390" viewBox="0 0 1240 390" role="img" aria-labelledby="title desc"><title id="title">STRATTON-CC-001 authority flows</title><desc id="desc">Workload, AI Governance and Internal Audit boundaries showing governed analysis, private evidence pull and copy, exact-submission verdict, signed audit push and signed receipt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><style>text{font-family:Segoe UI,Aptos,Calibri,sans-serif;fill:currentColor}.box{fill:none;stroke:currentColor;stroke-width:2}.flow{fill:none;stroke:currentColor;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}.h{font-size:19px;font-weight:700}.t{font-size:14px}.l{font-size:13px}</style></defs><rect x="30" y="120" width="350" height="190" rx="10" class="box"/><text x="50" y="150" class="h">Workload boundary</text><text x="50" y="180" class="t"><tspan x="50" dy="0">Signed submission and exact Blob versions</tspan><tspan x="50" dy="24">Governed analysis/vectorisation adapter</tspan><tspan x="50" dy="24">SQL outbox and signed ordered audit sender</tspan><tspan x="50" dy="24">Read-only receipt and exact-submission verdict</tspan></text><rect x="445" y="30" width="350" height="180" rx="10" class="box"/><text x="465" y="60" class="h">AI Governance boundary</text><text x="465" y="90" class="t"><tspan x="465" dy="0">Adapter, prompt, model and embedding approval</tspan><tspan x="465" dy="24">Chunking, injection, safety and limits</tspan><tspan x="465" dy="24">Index schema, filters and revocation policy</tspan></text><rect x="860" y="120" width="350" height="190" rx="10" class="box"/><text x="880" y="150" class="h">Internal Audit boundary</text><text x="880" y="180" class="t"><tspan x="880" dy="0">Private API and exact-version pull/copy to WORM</tspan><tspan x="880" dy="24">Static verification / authorised isolated evaluator</tspan><tspan x="880" dy="24">Audit receiver and continuity authority</tspan><tspan x="880" dy="24">Purpose-separated receipt and verdict signing</tspan></text><path d="M445 130H380" class="flow"/><text x="385" y="115" class="l">approved binding</text><path d="M380 215H860" class="flow"/><text x="485" y="235" class="l">signed manifest / signed ordered audit push</text><path d="M860 265H380" class="flow dash"/><text x="500" y="285" class="l">private pull/copy • signed receipt • exact-submission verdict</text><text x="30" y="355" class="l">Logical authority overlay only. Exact owner parameters remain unresolved and fail closed.</text></svg>