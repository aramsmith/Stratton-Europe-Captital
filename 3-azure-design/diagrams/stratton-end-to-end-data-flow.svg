<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="800" viewBox="0 0 1450 800" role="img" aria-labelledby="title desc">
  <title id="title">Citadel and Stratton governed regional data and decision flow</title>
  <desc id="desc">Read-only and licensed evidence passes Citadel ALZ, AI-governance and sovereign fail-closed policy overlays before regional assistive analysis. Global and DataZone AI are denied. Cited drafts require human review and regional immutable evidence is submitted to Internal Audit.</desc>
  <defs>
    <style>.bg{fill:#fff}.box{fill:#fff;stroke:#4f4f4f;stroke-width:1.5}.blue{fill:#e8f3ff;stroke:#0078d4;stroke-width:2}.green{fill:#edf7ed;stroke:#107c10;stroke-width:2}.red{fill:#fff1f0;stroke:#a4262c;stroke-width:2}.amber{fill:#fff4ce;stroke:#d6b656;stroke-width:2}.purple{fill:#f3e8ff;stroke:#5c2d91;stroke-width:2}.t{font:15px 'Segoe UI',sans-serif;fill:#242424}.h{font:bold 19px 'Segoe UI',sans-serif;fill:#242424}.small{font:13px 'Segoe UI',sans-serif;fill:#242424}.a{fill:none;stroke:#4f4f4f;stroke-width:2;marker-end:url(#m)}.p{fill:none;stroke:#5c2d91;stroke-width:2;marker-end:url(#p)}</style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#4f4f4f"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5c2d91"/></marker>
  </defs>
  <rect class="bg" width="1450" height="800"/><text class="h" x="35" y="38">Citadel / Stratton Release 1 — governed regional data and decision flow</text>
  <g aria-label="Microsoft Azure architecture icon" transform="translate(1385 12)"><path d="M18 2L4 30h12l8-16 8 16h12L28 2z" fill="#0078d4"/><path d="M17 34h29l-6 10H11z" fill="#50e6ff"/></g>
  <rect class="blue" x="35" y="90" rx="9" width="190" height="80"/><text class="t" x="55" y="120">Internal sources</text><text class="small" x="55" y="145">Authoritative / read-only</text>
  <rect class="amber" x="35" y="215" rx="9" width="190" height="85"/><text class="t" x="55" y="245">External sources</text><text class="small" x="55" y="270">Licence + AI-use approval</text>
  <rect class="red" x="285" y="145" rx="9" width="215" height="105"/><text class="t" x="305" y="175">Private quarantine</text><text class="small" x="305" y="202">Malware/content scan</text><text class="small" x="305" y="227">No analysis access</text>
  <rect class="purple" x="555" y="130" rx="9" width="250" height="135"/><text class="t" x="575" y="160">Citadel fail-closed policy</text><text class="small" x="575" y="187">ALZ + AI + sovereign overlays</text><text class="small" x="575" y="210">purpose / privacy / licence</text><text class="small" x="575" y="233">approved region / quality</text><text class="small" x="575" y="255">Missing evidence = DENY</text>
  <rect class="green" x="865" y="145" rx="9" width="245" height="105"/><text class="t" x="885" y="175">Admitted evidence</text><text class="small" x="885" y="202">Blob + SQL envelope</text><text class="small" x="885" y="227">Hash / provenance / schedule</text>
  <rect class="blue" x="1170" y="80" rx="9" width="220" height="85"/><text class="t" x="1190" y="110">Document Intelligence</text><text class="small" x="1190" y="137">Prebuilt extraction</text>
  <rect class="blue" x="1170" y="205" rx="9" width="220" height="100"/><text class="t" x="1190" y="235">Azure AI Search</text><text class="small" x="1190" y="262">Derived chunks/vectors</text><text class="small" x="1190" y="285">Evidence IDs and filters</text>
  <path class="a" d="M225 130H285"/><path class="a" d="M225 258H255V210H285"/><path class="a" d="M500 198H555"/><path class="a" d="M805 198H865"/><path class="a" d="M1110 180L1170 125"/><path class="a" d="M1110 215L1170 255"/>
  <rect class="blue" x="1040" y="380" rx="9" width="280" height="125"/><text class="t" x="1060" y="410">Azure OpenAI regional inference</text><text class="small" x="1060" y="437">Primary / approved recovery</text><text class="small" x="1060" y="460">Global and DataZone denied</text><text class="small" x="1060" y="483">No fine-tuning / autonomous tools</text>
  <rect class="green" x="720" y="390" rx="9" width="250" height="110"/><text class="t" x="740" y="420">Draft claims + citations</text><text class="small" x="740" y="447">Claim-to-evidence keys</text><text class="small" x="740" y="470">Quality visible</text>
  <rect class="amber" x="405" y="385" rx="9" width="255" height="120"/><text class="t" x="425" y="415">Human review</text><text class="small" x="425" y="442">Deal professional validation</text><text class="small" x="425" y="465">Legal / Compliance approval</text><text class="small" x="425" y="488">Identity + subject hash</text>
  <rect class="red" x="65" y="395" rx="9" width="270" height="100"/><text class="t" x="85" y="425">Committee-ready DRAFT</text><text class="small" x="85" y="452">Investment Committee decision</text><text class="small" x="85" y="475">remains outside solution</text>
  <path class="a" d="M1280 305V345H1180V390"/><path class="a" d="M1040 445H970"/><path class="a" d="M720 445H660"/><path class="a" d="M405 445H335"/>
  <rect class="purple" x="475" y="615" rx="9" width="330" height="115"/><text class="t" x="495" y="645">Regional immutable audit evidence</text><text class="small" x="495" y="672">Controlled approved-pair replication</text><text class="small" x="495" y="695">Case / evidence / policy / review</text><text class="small" x="495" y="718">correlation without sensitive bodies</text>
  <rect class="purple" x="900" y="615" rx="9" width="365" height="115"/><text class="t" x="920" y="645">Citadel Internal Audit assurance</text><text class="small" x="920" y="672">Regional read-only evidence + verdict</text><text class="small" x="920" y="695">Audit controls replication/retention</text><text class="small" x="920" y="718">Delivery cannot modify verdict</text>
  <path class="p" d="M680 255V590H640V625"/><path class="p" d="M805 675H900"/>
