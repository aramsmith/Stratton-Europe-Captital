<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Citadel enterprise hub-connected regional network and security boundaries</title>
  <desc id="desc">Citadel contains primary and recovery regional hubs with central DNS and Firewall Premium. Enterprise IPAM-assigned production spokes use private ingress and endpoints. Public data services, Global and DataZone AI, direct Internet and unapproved regions are denied.</desc>
  <defs>
    <style>.bg{fill:#fff}.vnet{fill:#f7f7f7;stroke:#0078d4;stroke-width:3}.box{fill:#fff;stroke:#4f4f4f;stroke-width:1.5}.blue{fill:#e8f3ff;stroke:#0078d4;stroke-width:2}.green{fill:#edf7ed;stroke:#107c10;stroke-width:2}.red{fill:#fff1f0;stroke:#a4262c;stroke-width:2}.amber{fill:#fff4ce;stroke:#d6b656;stroke-width:2}.deny{fill:#fde7e9;stroke:#a4262c;stroke-width:2}.t{font:15px 'Segoe UI',sans-serif;fill:#242424}.h{font:bold 19px 'Segoe UI',sans-serif;fill:#242424}.small{font:13px 'Segoe UI',sans-serif;fill:#242424}.a{fill:none;stroke:#0078d4;stroke-width:2;marker-end:url(#m)}.eg{fill:none;stroke:#d6b656;stroke-width:2;marker-end:url(#y)}</style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0078d4"/></marker>
    <marker id="y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d6b656"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820"/><text class="h" x="35" y="38">Citadel — enterprise hub-connected regional network and security boundaries</text>
  <g aria-label="Microsoft Azure architecture icon" transform="translate(1335 12)"><path d="M18 2L4 30h12l8-16 8 16h12L28 2z" fill="#0078d4"/><path d="M17 34h29l-6 10H11z" fill="#50e6ff"/></g>
  <rect class="blue" x="35" y="95" rx="10" width="245" height="90"/><text class="t" x="55" y="125">Enterprise network / IPAM</text><text class="small" x="55" y="150">Authorised users and admins</text><text class="small" x="55" y="172">Exact connection IDs pending</text>
  <rect class="vnet" x="320" y="70" rx="14" width="1045" height="710"/><text class="h" x="345" y="108">sub-citadel-connectivity + hub-connected spokes — exact regions/CIDRs pending</text>
  <rect class="red" x="350" y="145" rx="9" width="205" height="85"/><text class="t" x="372" y="175">snet-ingress</text><text class="small" x="372" y="202">Private App Gateway WAF</text>
  <rect class="red" x="590" y="145" rx="9" width="205" height="100"/><text class="t" x="612" y="175">snet-apim</text><text class="small" x="612" y="202">Private API Management</text><text class="small" x="612" y="225">Public gateway disabled</text>
  <rect class="green" x="830" y="145" rx="9" width="220" height="100"/><text class="t" x="852" y="175">snet-app delegated</text><text class="small" x="852" y="202">Internal apps / policy</text><text class="small" x="852" y="225">Event-driven jobs</text>
  <rect class="blue" x="1085" y="145" rx="9" width="245" height="115"/><text class="t" x="1107" y="175">snet-private-endpoints</text><text class="small" x="1107" y="202">SQL / Blob / Search / AI</text><text class="small" x="1107" y="225">Bus / Vault / ACR / Monitor</text><text class="small" x="1107" y="248">SQL public access disabled</text>
  <path class="a" d="M280 135H350"/><path class="a" d="M555 188H590"/><path class="a" d="M795 188H830"/><path class="a" d="M1050 195H1085"/>
  <text class="small" x="290" y="125">443 private</text><text class="small" x="558" y="180">443</text><text class="small" x="798" y="180">443</text><text class="small" x="1048" y="185">443/1433</text>
  <rect class="amber" x="410" y="335" rx="9" width="300" height="100"/><text class="t" x="432" y="365">Citadel primary regional hub</text><text class="small" x="432" y="392">Firewall Premium / enterprise WAN</text><text class="small" x="432" y="415">Default deny / IDPS</text>
  <rect class="blue" x="760" y="335" rx="9" width="240" height="90"/><text class="t" x="782" y="365">Citadel central DNS</text><text class="small" x="782" y="392">Regional resolvers / no direct DNS</text>
  <rect class="green" x="1050" y="325" rx="9" width="250" height="100"/><text class="t" x="1072" y="355">Approved source APIs</text><text class="small" x="1072" y="382">Read-only permission</text><text class="small" x="1072" y="405">Owner evidence required</text>
  <rect class="red" x="1050" y="475" rx="9" width="250" height="110"/><text class="t" x="1072" y="505">Licensed external sources</text><text class="small" x="1072" y="532">Licence / purpose / AI-use</text><text class="small" x="1072" y="555">Jurisdiction and expiry gate</text>
  <rect class="amber" x="410" y="500" rx="9" width="300" height="100"/><text class="t" x="432" y="530">Citadel recovery regional hub</text><text class="small" x="432" y="557">Firewall Premium / enterprise WAN</text><text class="small" x="432" y="580">Central DNS Resolver</text>
  <rect class="green" x="760" y="500" rx="9" width="240" height="100"/><text class="t" x="782" y="530">Warm recovery spoke</text><text class="small" x="782" y="557">Private apps / data / regional AI</text><text class="small" x="782" y="580">Global/DataZone denied</text>
  <path class="eg" d="M940 245C920 300 700 300 650 335"/><path class="eg" d="M710 385H1050"/><path class="eg" d="M650 435C700 525 900 530 1050 530"/>
  <path class="eg" d="M560 435V500M710 550H760"/>
  <rect class="deny" x="400" y="670" rx="10" width="900" height="75"/><text class="t" x="425" y="700">DENY: public database/data/AI; Global/DataZone AI; direct Internet/DNS;</text><text class="t" x="425" y="726">environment peering; source write-back; unapproved region, CIDR or transfer.</text>
</svg>
