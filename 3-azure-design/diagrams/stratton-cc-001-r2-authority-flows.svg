<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc"><title id="title">STRATTON-CC-001 round 2 authority, supply-chain and trust-snapshot flows</title><desc id="desc">Delivery contributes candidate source to an independently administered Internal Audit repository. Separate identities merge, build, sign, publish, deploy and operate. Workload signed records and Internal Audit receipts and verdicts are stored with exact signing-time trust snapshots in WORM.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><style>text{font-family:Segoe UI,Aptos,Calibri,sans-serif;fill:currentColor}.box{fill:none;stroke:currentColor;stroke-width:2}.flow{fill:none;stroke:currentColor;stroke-width:2;marker-end:url(#arrow)}.h{font-size:16px;font-weight:700}.t{font-size:12px}.l{font-size:11px}</style></defs><rect x="20" y="30" width="190" height="95" rx="10" class="box"/><text x="32" y="55" class="h">Delivery contribution</text><text x="32" y="78" class="t"><tspan x="32" dy="0">candidate only</tspan><tspan x="32" dy="18">no merge/admin/release</tspan></text><rect x="235" y="30" width="220" height="95" rx="10" class="box"/><text x="247" y="55" class="h">IA source repository</text><text x="247" y="78" class="t"><tspan x="247" dy="0">protected branch/CODEOWNERS</tspan><tspan x="247" dy="18">two-person acceptance</tspan></text><rect x="480" y="30" width="195" height="95" rx="10" class="box"/><text x="492" y="55" class="h">Reproducible build</text><text x="492" y="78" class="t"><tspan x="492" dy="0">separate identity</tspan><tspan x="492" dy="18">provenance/SBOM/scans</tspan></text><rect x="700" y="30" width="155" height="95" rx="10" class="box"/><text x="712" y="55" class="h">Release signing</text><text x="712" y="78" class="t"><tspan x="712" dy="0">separate key identity</tspan></text><rect x="880" y="30" width="180" height="95" rx="10" class="box"/><text x="892" y="55" class="h">ACR publication</text><text x="892" y="78" class="t"><tspan x="892" dy="0">separate publisher</tspan><tspan x="892" dy="18">immutable digest</tspan></text><rect x="1085" y="30" width="195" height="95" rx="10" class="box"/><text x="1097" y="55" class="h">DU-16 deployment</text><text x="1097" y="78" class="t"><tspan x="1097" dy="0">separate deployer</tspan><tspan x="1097" dy="18">exact digest/config</tspan></text><rect x="1305" y="30" width="175" height="95" rx="10" class="box"/><text x="1317" y="55" class="h">Operations/rollback</text><text x="1317" y="78" class="t"><tspan x="1317" dy="0">separate authority</tspan><tspan x="1317" dy="18">prior approved release</tspan></text><rect x="160" y="245" width="300" height="110" rx="10" class="box"/><text x="172" y="270" class="h">Workload + AI governance</text><text x="172" y="293" class="t"><tspan x="172" dy="0">governed analysis binding</tspan><tspan x="172" dy="18">signed submission/audit</tspan></text><rect x="620" y="225" width="350" height="140" rx="10" class="box"/><text x="632" y="250" class="h">Internal Audit runtime</text><text x="632" y="273" class="t"><tspan x="632" dy="0">private API/pull-copy/evaluator</tspan><tspan x="632" dy="18">audit receiver/receipt/verdict signers</tspan></text><rect x="620" y="445" width="350" height="90" rx="10" class="box"/><text x="632" y="470" class="h">Internal Audit WORM</text><text x="632" y="493" class="t"><tspan x="632" dy="0">signed record + exact signedAt</tspan><tspan x="632" dy="18">TrustVerificationSnapshot/hash</tspan></text><path d="M210 78L235 78" class="flow"/><text x="214" y="72" class="l">controlled</text><path d="M455 78L480 78" class="flow"/><text x="459" y="72" class="l">tree</text><path d="M675 78L700 78" class="flow"/><text x="679" y="72" class="l">provenance</text><path d="M855 78L880 78" class="flow"/><text x="859" y="72" class="l">signature</text><path d="M1060 78L1085 78" class="flow"/><text x="1064" y="72" class="l">digest</text><path d="M1280 78L1305 78" class="flow"/><text x="1284" y="72" class="l">deployed</text><path d="M460 300L620 290" class="flow"/><text x="464" y="284" class="l">signed envelopes</text><path d="M795 365L795 445" class="flow"/><text x="799" y="359" class="l">record + snapshot</text><path d="M620 330L460 330" class="flow"/><text x="464" y="324" class="l">receipt/verdict</text><text x="20" y="580" class="l">All IDs, policies, reviewers, identities, keys, retention and endpoints are owner-supplied fail-closed values.</text></svg>