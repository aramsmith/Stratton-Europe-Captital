<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Approved vendor-neutral target application architecture</title>
<desc id="desc">Authorised users open a controlled case. Read-only sources and an external licence gate feed controlled ingestion, evidence provenance, assistive analysis, grounding, human review and a draft recommendation. Policy and audit services span the flow. The investment committee retains decision authority.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#0369a1"/></marker><style>.bg{fill:#fff}.zone{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.box{fill:#fff;stroke:#0369a1;stroke-width:2}.control{fill:#ecfeff;stroke:#0e7490;stroke-width:2}.human{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.audit{fill:#faf5ff;stroke:#7e22ce;stroke-width:2}.t{font:16px Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font:bold 21px Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:13px Segoe UI,Arial,sans-serif;fill:#334155}.e{stroke:#0369a1;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style></defs>
<rect class="bg" width="1400" height="620"/><text class="h" x="40" y="38">Approved vendor-neutral target: governed evidence to human decision</text>
<rect class="zone" x="35" y="70" width="1330" height="470" rx="18"/>
<rect class="human" x="60" y="115" width="165" height="78" rx="12"/><text class="t" x="82" y="146">Authorised users</text><text class="s" x="82" y="171">Case opening</text>
<rect class="box" x="260" y="115" width="180" height="78" rx="12"/><text class="t" x="282" y="146">Case &amp; eligibility</text><text class="s" x="282" y="171">Scope and state</text>
<rect class="box" x="60" y="245" width="165" height="78" rx="12"/><text class="t" x="82" y="276">Read-only sources</text><text class="s" x="82" y="301">Authority retained</text>
<rect class="control" x="260" y="245" width="180" height="78" rx="12"/><text class="t" x="282" y="276">Controlled ingestion</text><text class="s" x="282" y="301">Quarantine + gates</text>
<rect class="box" x="480" y="245" width="180" height="78" rx="12"/><text class="t" x="502" y="276">Evidence envelope</text><text class="s" x="502" y="301">Provenance + quality</text>
<rect class="box" x="700" y="245" width="180" height="78" rx="12"/><text class="t" x="722" y="276">Assistive analysis</text><text class="s" x="722" y="301">No decision authority</text>
<rect class="box" x="920" y="245" width="180" height="78" rx="12"/><text class="t" x="942" y="276">Grounding &amp; citation</text><text class="s" x="942" y="301">Evidence-linked claims</text>
<rect class="human" x="1140" y="210" width="190" height="98" rx="12"/><text class="t" x="1162" y="244">Human review gates</text><text class="s" x="1162" y="269">Deal + specialist</text><text class="s" x="1162" y="290">approvals</text>
<rect class="human" x="1140" y="370" width="190" height="78" rx="12"/><text class="t" x="1162" y="401">Draft recommendation</text><text class="s" x="1162" y="426">Committee-ready only</text>
<rect class="control" x="480" y="115" width="400" height="78" rx="12"/><text class="t" x="502" y="146">Common policy decision and enforcement</text><text class="s" x="502" y="171">Admission · access · analysis · review · transfer</text>
<rect class="audit" x="480" y="370" width="620" height="78" rx="12"/><text class="t" x="502" y="401">Correlated audit evidence</text><text class="s" x="502" y="426">Case · data · AI · access · review · control history</text>
<rect class="human" x="1140" y="485" width="190" height="78" rx="12"/><text class="t" x="1162" y="516">Investment Committee</text><text class="s" x="1162" y="541">Decision retained</text>
